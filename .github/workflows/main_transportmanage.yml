name: Deploy to GCP App Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Inject secrets into app.yaml
        run: |
          sed -i "s|__SPRING_DATASOURCE_URL__|${{ secrets.SPRING_DATASOURCE_URL }}|g" app.yaml
          sed -i "s|__SPRING_DATASOURCE_USERNAME__|${{ secrets.SPRING_DATASOURCE_USERNAME }}|g" app.yaml
          sed -i "s|__SPRING_DATASOURCE_PASSWORD__|${{ secrets.SPRING_DATASOURCE_PASSWORD }}|g" app.yaml

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet
